packages:
  - 'packages/*'

# Single source of truth for the versions the legacy widget bundles share
# between the reactComponent path (@openeventkit/widgets) and the web-component
# path (@openeventkit/web-components). Bump here once, not in both package.jsons.
# react / react-dom are NOT catalogued: web-components pins its own React 17 for
# the isolated esbuild bundle; the app runs React 19. pnpm keeps them separate.
catalog:
  '@emotion/cache': ^11.14.0
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.0
  'awesome-bootstrap-checkbox': ^2.0.1
  'chain-function': ^1.0.1
  'crypto-js': ^4.2.0
  'event-feedback-widget': 2.0.1
  'final-form': ^4.20.10
  'font-awesome': 4.7.0
  'full-schedule-widget': 3.1.3
  'i18n-react': ^0.7.0
  'idtoken-verifier': ^2.2.4
  'lite-schedule-widget': 3.0.3
  'live-event-widget': 4.0.4
  'lodash': ^4.18.1
  'moment': ^2.30.1
  'moment-timezone': ^0.5.48
  'my-orders-tickets-widget': 1.0.16
  'openstack-uicore-foundation': 4.2.34
  'react-bootstrap': ^0.33.1
  'react-final-form': ^6.5.9
  'react-redux': ^7.2.9
  'redux': ^4.2.1
  'redux-persist': ^5.10.0
  'redux-thunk': ^2.4.2
  'schedule-filter-widget': 3.0.8
  'spark-md5': ^3.0.2
  'speakers-widget': 4.0.2
  'summit-registration-lite': 7.0.10
  'superagent': ^3.8.3
  'sweetalert2': ^11.26.25
  'upcoming-events-widget': 3.0.7

# react-star-ratings@2.3.0 mis-declares react@16.14.0 as a regular dependency
# (not a peer) — force it onto the web-component bundle's React 17 so the
# standalone build can't inline a second React.
overrides:
  'react-star-ratings>react': 17.0.2
  'openstack-uicore-foundation': github:gcutrini/openstack-uicore-foundation#deploy
  'summit-registration-lite': github:gcutrini/summit-registration-lite#deploy/wc-registration
